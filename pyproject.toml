[project]
name = "windtunnel"
version = "0.1.0"
description = "Race candidate AI system designs on your own examples and ship the measured winner."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["openai>=1.40", "httpx>=0.27", "fastapi>=0.115", "uvicorn>=0.30", "mcp>=1.2"]

[project.scripts]
windtunnel = "windtunnel.cli:main"
windtunnel-mcp = "windtunnel.mcp_server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
